name: Build fork release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install cython setuptools polib
      - name: Run tests
        timeout-minutes: 10
        run: |
          Get-ChildItem -LiteralPath tests -Filter "Test*.py" | Sort-Object Name | ForEach-Object {
            python -u -m unittest discover -s tests -p $_.Name -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows installers
        uses: ok-oldking/pyappify-action@c5cc8fe5c9bd5c732969018694a2645474c48b7e
        with:
          version: v1.2.3
      - name: Version artifacts and calculate checksums
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          Get-ChildItem -LiteralPath pyappify_dist -File | ForEach-Object {
            Rename-Item -LiteralPath $_.FullName -NewName "$($_.BaseName)-$env:RELEASE_VERSION$($_.Extension)"
          }
          $installers = @(Get-ChildItem -LiteralPath pyappify_dist -Filter '*-setup-*.exe')
          if ($installers.Count -lt 2) { throw 'Expected both full and online installers' }
          Get-ChildItem -LiteralPath pyappify_dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath pyappify_dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.ref_name }}
          path: pyappify_dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installers-${{ github.ref_name }}
          path: pyappify_dist
      - uses: softprops/action-gh-release@v2
        with:
          name: '${{ github.ref_name }} · Dewcat 测试版'
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            基于 AliceJump/ok-gf2 的 Dewcat fork 测试版。

            - 活动层喝水、吃饭支持独立开关，保留领奖流程。
            - 推图识别完成标记，优先处理上下支路，并改进地图导航恢复。
            - 增加推图规划回归测试。
            - 安装和更新来源为 Dewcat/ok-gf2。

            下载 `ok-gf2-win32-dewcat-setup-${{ github.ref_name }}.exe` 完整安装包（包含 Python 和依赖）。
            `online-setup` 为在线安装包，首次启动需要联网下载依赖。
            `SHA256SUMS.txt` 提供附件校验值。Source code 为源码，不是安装包。

            自动化检查已通过；本测试版尚未完成游戏内完整流程验证。
          files: pyappify_dist/*
